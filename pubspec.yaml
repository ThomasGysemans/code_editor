name: code_editor
description: A code editor (dart, js, html,...) for Flutter with syntax highlighting and custom theme.
version: 3.0.0
homepage: https://github.com/ThomasGysemans/code_editor

environment:
  sdk: ^3.9.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_highlight: ^0.7.0
  font_awesome_flutter: ^11.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
